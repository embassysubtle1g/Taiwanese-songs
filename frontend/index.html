<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>奶奶音樂</title>
  <link
    rel="icon"
    type="image/png"
    href="./images/Taiwanese_songs.png"
  >
  <link rel="stylesheet" href="./css/style.css">
  <script src="./js/script.js" defer></script>
</head>

<body>
  <!-- 固定頂部 -->
  <div id="header">
    <button id="backButton" onclick="showArtistsPage()">
      ← 返回
    </button>

    <h1 id="pageTitle">歌手</h1>
  </div>

  <!-- 歌手列表 -->
  <div id="artistList"></div>

  <!-- 歌曲列表 -->
  <div id="songList" style="display:none;">
    <div id="songs"></div>
  </div>

  <!-- Loading -->
  <div id="loading">
    <div class="spinner"></div>
    <div class="loading-text">
      載入中...
    </div>
  </div>
</body>
</html>
