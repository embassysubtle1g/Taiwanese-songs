name: Android build

on:
  push:
    branches:
      - main
    paths:
      - "android/**"
      - "frontend/images/Taiwanese_songs.png"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "android/**"
      - "frontend/images/Taiwanese_songs.png"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare app launcher icon
        run: |
          mkdir -p android/app/src/main/res/drawable-nodpi
          curl --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/frontend/images/Taiwanese_songs.png" \
            --output android/app/src/main/res/drawable-nodpi/taiwanese_songs_icon.png

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build debug APK
        working-directory: android
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: taiwanese-songs-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
